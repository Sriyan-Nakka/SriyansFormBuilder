<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sai Sriyan Nakka" />
    <meta
      name="description"
      content="An easy to use Form Builder which is totally free to use!"
    />
    <link rel="stylesheet" href="assets/global.css" />
    <title>Sriyan's Form Builder | Sign Up</title>
    <style>
      body {
        text-align: center;
      }
      header {
        text-align: center;
        font-size: 1.3rem;
        margin-top: 10px;
      }
      h2 {
        margin: 15px 0;
        font-size: 1.8rem;
        font-family: Lexend, serif;
      }
      main {
        margin: 10px;
        padding: 20px;
        padding-top: 15px;
        margin-top: 20px;
        background-color: hsl(0, 0%, 10%);
        border-radius: 15px;
        display: inline-block;
      }
      form {
        padding: 5px;
      }
      form p {
        margin: 15px 0;
      }
      input {
        color: white;
        font-size: 1.3rem;
        background-color: hsl(0, 0%, 25%);
        border: none;
        border-radius: 5px;
        padding: 10px;
      }
      label {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <script src="script.js" defer></script>
    <header>
      <h1>
        <span style="color: var(--accent2)"> Sriyan's </span>
        Form Builder
      </h1>
    </header>
    <main>
      <h2>Create Your Account</h2>
      <form id="signupForm" method="POST">
        <p>
          <input
            type="email"
            placeholder="Email"
            name="email"
            id="email"
            required
          />
        </p>
        <p>
          <input
            type="password"
            placeholder="Password"
            name="password"
            id="password"
            required
          />
          <br />
          <label for="showPass">
            <small>
              <input type="checkbox" name="showPass" id="showPass" />
              Show Password
            </small>
          </label>
          <br />
        </p>
      </form>
    </main>
    <footer>
      <span class="links">
        <a
          href="https://github.com/Sriyan-Nakka"
          target="_blank"
          title="My GitHub"
        >
          <svg
            class="icon github"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              fill="gray"
              d="M12 1A10.89 10.89 0 0 0 1 11.77A10.79 10.79 0 0 0 8.52 22c.55.1.75-.23.75-.52v-1.83c-3.06.65-3.71-1.44-3.71-1.44a2.86 2.86 0 0 0-1.22-1.58c-1-.66.08-.65.08-.65a2.31 2.31 0 0 1 1.68 1.11a2.37 2.37 0 0 0 3.2.89a2.33 2.33 0 0 1 .7-1.44c-2.44-.27-5-1.19-5-5.32a4.15 4.15 0 0 1 1.11-2.91a3.78 3.78 0 0 1 .11-2.84s.93-.29 3 1.1a10.7 10.7 0 0 1 5.5 0c2.1-1.39 3-1.1 3-1.1a3.78 3.78 0 0 1 .11 2.84A4.15 4.15 0 0 1 19 11.2c0 4.14-2.58 5.05-5 5.32a2.5 2.5 0 0 1 .75 2v2.95c0 .35.2.63.75.52A10.8 10.8 0 0 0 23 11.77A10.89 10.89 0 0 0 12 1"
            />
          </svg>
        </a>
        <a
          href="https://sriyansites.web.app"
          target="_blank"
          title="My Website"
        >
          <svg
            class="icon"
            width="35px"
            height="35px"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            fill="gray"
          >
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g
              id="SVGRepo_tracerCarrier"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></g>
            <g id="SVGRepo_iconCarrier">
              <defs>
                <style>
                  .cls-1 {
                    fill: none;
                    stroke: gray;
                    stroke-miterlimit: 10;
                    stroke-width: 1.92px;
                  }
                </style>
              </defs>
              <g id="roll_brush" data-name="roll brush">
                <rect
                  class="cls-1"
                  x="1.46"

                ></rect>
                <polygon

                ></polygon>
                <line

        </a>
      </span>
      <br />
      &copy; Copyright, Sai Sriyan Nakka 2026, All Rights Reserved.

    </footer>
  </body>
</html>
