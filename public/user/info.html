<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sai Sriyan Nakka" />
    <meta
      name="description"
      content="An easy to use Form Builder which is totally free to use!"
    />
    <link rel="stylesheet" href="../assets/global.css" />
    <link rel="stylesheet" href="../assets/loader.css" />
    <link rel="stylesheet" href="../assets/auth.css" />
    <title>Sriyan's Form Builder | Your User Info</title>
    <style>
      main,
      footer {
        text-align: left;
      }
      h1 {
        font-size: 2.6rem;
        margin: 15px 0;
      }
      main {
        width: 100%;
        background-color: var(--bg1);
        padding: 15px;
        position: relative;
        border-radius: 15px;

        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 5px;
      }
      main div {
        padding: 10px;
        padding-bottom: 25px;
      }

      #editInfo {
        background: hsl(0, 0%, 10%);
      }
      #editInfo:hover {
        background: hsl(0, 0%, 20%);
      }
      input:not([type="checkbox"]):not([type="radio"]) {
        outline: 2px solid white !important;
      }

      #username-prefix {
        transform: translateY(-17px);
      }
      input:not([type="checkbox"]):not([type="radio"])[readonly] {
        max-width: 300px;
        outline: 2px solid hsl(0, 0%, 55%) !important;
      }
      #profileDiv p {
        margin: 10px;
      }
      #profileDiv button {
        margin: 5px;
      }
      #cardDiv {
        border-right: 1px solid var(--border);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #cardDiv #buttons button {
        padding: 5px;
      }
      #shareBtn,
      #downloadBtn {
        width: 48px;
        height: 48px;
        padding: 0;
        border: none;
        border-radius: 50%;
        cursor: pointer;
      }
      #updateInfo {
        background-color: oklch(52% 0.18 143);
        display: none;
      }
      #updateInfo:hover {
        background-color: oklch(57% 0.18 143);
      }
      @media (max-width: 768px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        legend {
          text-align: center;
        }
        #cardDiv {
          border: none;
          height: 300px;
          justify-content: center;
          align-items: center;
        }

        #card {
          width: 153.6px; /* 128 × 1.2 */
          height: 230.4px; /* 192 × 1.2 */
          background-color: white;
        }

        #buttons {
          display: flex;
          justify-content: center;
          gap: 10px;
        }

        #shareBtn,
        #downloadBtn {
          width: 48px;
          height: 48px;
          padding: 0;
          border: none;
          border-radius: 50%;

          display: flex;
          align-items: center;
          justify-content: center;
        }
        main div {
          padding-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="loadingOverlay">
      <div class="spinner" aria-label="Loading"></div>
    </div>
    <!-- navbar soon -->
    <nav></nav>
    <main>
      <div id="cardDiv">
        <center>
          <div
            id="card"
            style="width: 128px; height: 192px; background-color: white"
          ></div>
          <div id="buttons">
            <button id="shareBtn">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                style="transform: translateY(2px)"
              >
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                  fill="currentColor"
                  d="M17 22q-1.25 0-2.125-.875T14 19q0-.15.075-.7L7.05 14.2q-.4.375-.925.588T5 15q-1.25 0-2.125-.875T2 12t.875-2.125T5 9q.6 0 1.125.213t.925.587l7.025-4.1q-.05-.175-.062-.337T14 5q0-1.25.875-2.125T17 2t2.125.875T20 5t-.875 2.125T17 8q-.6 0-1.125-.213T14.95 7.2l-7.025 4.1q.05.175.063.338T8 12t-.012.363t-.063.337l7.025 4.1q.4-.375.925-.587T17 16q1.25 0 2.125.875T20 19t-.875 2.125T17 22"
                />
              </svg>
            </button>
            <button id="downloadBtn">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                style="transform: translateY(2px)"
              >
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                  fill="currentColor"
                  d="m12 16l-5-5l1.4-1.45l2.6 2.6V4h2v8.15l2.6-2.6L17 11zm-6 4q-.825 0-1.412-.587T4 18v-3h2v3h12v-3h2v3q0 .825-.587 1.413T18 20z"
                />
              </svg>
            </button>
          </div>
        </center>
      </div>
      <div id="profileDiv">
        <fieldset>
          <legend>
            <h2 style="padding-left: 5px">Your User Info</h2>
          </legend>
          <p style="margin-top: 0">
            <label for="pAccountName">
              <small>Account Name</small>
              <br />
              <input id="pAccountName" type="text" />
            </label>
          </p>
          <p>
            <label for="pUsername">
              <small> Username </small> <br />
              <span id="username-input">
                <span id="username-prefix">@</span>
                <input
                  type="text"
                  name="username"
                  id="pUsername"
                  onkeyup="this.value = this.value.replace(/\s/g, '')"
                  autocomplete="off"
                  minlength="5"
                />
              </span>
            </label>
          </p>
          <p id="pID" style="margin-top: 15px; margin-bottom: 0px"></p>
          <p style="margin-top: 5px">
            <button id="editInfo" style="margin-left: 0">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24px"
                height="24px"
                style="transform: translateY(2px)"
                viewBox="0 0 24 24"
              >
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="m4.144 16.735l.493-3.425a.97.97 0 0 1 .293-.587l9.665-9.664a1.03 1.03 0 0 1 .973-.281a5.1 5.1 0 0 1 2.346 1.372a5.1 5.1 0 0 1 1.384 2.346a1.07 1.07 0 0 1-.282.973l-9.664 9.664a1.17 1.17 0 0 1-.598.294l-3.437.492a1.044 1.044 0 0 1-1.173-1.184m8.633-11.846l4.41 4.398M3.79 21.25h16.42"
                />
              </svg>
              Edit Info
            </button>
            <button id="updateInfo">Update Info</button>
          </p>
        </fieldset>
      </div>
    </main>
    <footer>
      <br />
      &copy; Copyright, Sai Sriyan Nakka 2026, All Rights Reserved.
      <br />Version 1.0.0 <br />
    </footer>

    <script type="module">
      import { getCookie } from "../assets/cookieFunctions.js";

      const overlay = document.getElementById("loadingOverlay");

      const dashboardUsername = getCookie("dashboardUsername");

      try {
        if (!dashboardUsername) {
          window.location.href = "/login";
        }

        const res = await fetch("/api/user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: dashboardUsername }),
        });

        const data = await res.json();

        if (data.success) {
          document.querySelector("#pAccountName").value = data.accountName;
          document
            .querySelector("#pAccountName")
            .setAttribute("readonly", true);
          document.querySelector("#pUsername").value = data.username;
          document.querySelector("#pUsername").setAttribute("readonly", true);
          document.querySelector("#pID").textContent = "ID: " + data.id;

          // add a profile button and configure it to that:
          //   document
          //     .getElementById("profileBtn")
          //     .addEventListener("click", () => {
          //       window.location.href = "/profile/@" + data.username;
          //     });
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("Something went wrong.");
        console.log(err);
      } finally {
        overlay.style.display = "none";
      }
    </script>
  </body>
</html>
