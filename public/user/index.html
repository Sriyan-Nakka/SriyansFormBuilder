<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sai Sriyan Nakka" />
    <meta
      name="description"
      content="An easy to use Form Builder which is totally free to use!"
    />
    <link rel="stylesheet" href="../assets/global.css" />
    <link rel="stylesheet" href="../assets/loader.css" />
    <title>Sriyan's Form Builder | Dashboard</title>
    <style>
      header,
      main {
        text-align: center;
      }
      h1 {
        font-size: 2.6rem;
        margin: 15px 0;
      }
      main {
        background-color: var(--bg1);
        padding: 15px;
        position: relative;
        border-radius: 15px;
      }
      #userIcon {
        position: absolute;
        top: 15px;
        left: 15px;
        background: none;
        padding: 5px;
      }
      #userIcon svg {
        padding: 0;
        margin: 0;
      }
      #accountName {
        --shadow: hsl(300, 100%, 25%);
        color: var(--accent3);
        font-weight: bold;
        text-shadow: 3px 5px 15px var(--shadow);
      }

      #accountInfo {
        text-align: left;
        position: fixed;
        top: var(--pos-y, 200px);
        left: var(--pos-x, 0px);

        margin: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        border: 2px solid var(--border);
        border-radius: 10px;

        opacity: 0;
        transform: translateY(10px);

        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          display 0.25s allow-discrete,
          overlay 0.25s allow-discrete;

        pointer-events: none;
      }

      #accountInfo:popover-open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;

        @starting-style {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      #accountInfo .info {
        width: 100%;
      }
      #accountInfo button {
        width: 100%;
        background: hsl(0, 0%, 10%);
        transition: background 0.5s ease-out;
      }
      #accountInfo button:hover {
        background: hsl(0, 0%, 20%);
        transition: background 0.1s ease-out;
      }
      #welcomeDiv {
        font-family: Lexend, sans-serif;
        font-size: 1.9rem;
      }
      @media (max-width: 768px) {
        #welcomeDiv {
          margin-top: 70px;
        }
        h1 {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>

    <script type="module">
      import { getCookie } from "../assets/cookieFunctions.js";
      console.log("SCRIPT LOADED");

      const overlay = document.getElementById("loadingOverlay");

      const dashboardUsername = getCookie("dashboardUsername");

      try {
        if (!dashboardUsername) {
          window.location.href = "/login";
        }

        const res = await fetch("/api/user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: dashboardUsername }),
        });

        const data = await res.json();

        if (data.success) {
          document.querySelector("#accountName").textContent = data.accountName;
          document.querySelector("#pAccName").textContent = data.accountName;
          document.querySelector("#pUsername").textContent =
            "@" + data.username;
          document.querySelector("#pID").textContent = "ID: " + data.id;

          document
            .getElementById("profileBtn")
            .addEventListener("click", () => {
              window.location.href = "/profile/@" + data.username;
            });
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("Something went wrong.");
      } finally {
        overlay.style.display = "none";
      }

      const userIcon = document.getElementById("userIcon");
      const accountInfo = document.getElementById("accountInfo");

      accountInfo.addEventListener("beforetoggle", (e) => {
        if (e.newState === "open") {
          const rect = userIcon.getBoundingClientRect();

          accountInfo.style.setProperty("--pos-x", `${rect.left + 5}px`);
          accountInfo.style.setProperty("--pos-y", `${rect.bottom}px`);
        }
      });

      document.getElementById("infoBtn").addEventListener("click", () => {
        window.location.href = "/user/info";
      });
    </script>
  </body>
</html>
