<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sai Sriyan Nakka" />
    <meta
      name="description"
      content="An easy to use Form Builder which is totally free to use!"
    />
    <link rel="stylesheet" href="../assets/global.css" />
    <link rel="stylesheet" href="../assets/loader.css" />
    <title>Sriyan's Form Builder | Dashboard</title>
    <style>
      header,
      main {
        text-align: center;
      }
      h1 {
        font-size: 2.6rem;
        margin: 15px 0;
      }
      main {
        background-color: var(--bg1);
        padding: 15px;
        position: relative;
      }
      #userIcon {
        position: absolute;
        top: 15px;
        left: 15px;
        background: none;
        padding: 5px;
      }
      #userIcon svg {
        padding: 0;
        margin: 0;
      }

      #accountInfo {
        position: fixed;
        margin: 0;
        padding: 10px;

        display: flex;
        flex-direction: column;
        gap: 10px;

        border: 2px solid var(--border);
        border-radius: 10px;

        opacity: 0;

        top: 200px;

        transition:
          opacity 0.25s ease,
          top 0.25s ease;

        pointer-events: none;
      }

      #accountInfo:popover-open {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <!-- <script src="/user/assets/script.js" defer></script> -->
    <div id="loadingOverlay">
      <div class="spinner" aria-label="Loading"></div>
    </div>

    <header>
      <h1>
        <span style="color: var(--accent2)"> Sriyan's </span>
        Form Builder
      </h1>
    </header>
    <main>
      <button id="userIcon" popovertarget="accountInfo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48px"
          height="48px"
          viewBox="0 0 48 48"
        >
          <path d="M0 0h48v48H0z" fill="none" />
          <g fill="currentColor">
            <path d="M32 20a8 8 0 1 1-16 0a8 8 0 0 1 16 0" />
            <path
              fill-rule="evenodd"
              d="M23.184 43.984C12.517 43.556 4 34.772 4 24C4 12.954 12.954 4 24 4s20 8.954 20 20s-8.954 20-20 20h-.274q-.272 0-.542-.016M11.166 36.62a3.028 3.028 0 0 1 2.523-4.005c7.796-.863 12.874-.785 20.632.018a2.99 2.99 0 0 1 2.498 4.002A17.94 17.94 0 0 0 42 24c0-9.941-8.059-18-18-18S6 14.059 6 24c0 4.916 1.971 9.373 5.166 12.621"
              clip-rule="evenodd"
            />
          </g>
        </svg>
      </button>
      <div class="popover" id="accountInfo" popover>
        <div id="pAccName">Name</div>
        <div id="pUsername">@name</div>
        <div id="pEdit">
          <button id="editData">Edit Info</button>
        </div>
      </div>

      <div style="font-family: Lexend, sans-serif; font-size: 2rem">
        Welcome,
        <span
          id="accountName"
          style="color: var(--accent3); font-weight: bold"
        ></span>
        !
      </div>
      <p>FORMS</p>
    </main>
    <footer>
      <span class="links">
        <a
          href="https://github.com/Sriyan-Nakka"
          target="_blank"
          title="My GitHub"
        >
          <svg
            class="icon github"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              fill="gray"
              d="M12 1A10.89 10.89 0 0 0 1 11.77A10.79 10.79 0 0 0 8.52 22c.55.1.75-.23.75-.52v-1.83c-3.06.65-3.71-1.44-3.71-1.44a2.86 2.86 0 0 0-1.22-1.58c-1-.66.08-.65.08-.65a2.31 2.31 0 0 1 1.68 1.11a2.37 2.37 0 0 0 3.2.89a2.33 2.33 0 0 1 .7-1.44c-2.44-.27-5-1.19-5-5.32a4.15 4.15 0 0 1 1.11-2.91a3.78 3.78 0 0 1 .11-2.84s.93-.29 3 1.1a10.7 10.7 0 0 1 5.5 0c2.1-1.39 3-1.1 3-1.1a3.78 3.78 0 0 1 .11 2.84A4.15 4.15 0 0 1 19 11.2c0 4.14-2.58 5.05-5 5.32a2.5 2.5 0 0 1 .75 2v2.95c0 .35.2.63.75.52A10.8 10.8 0 0 0 23 11.77A10.89 10.89 0 0 0 12 1"
            />
          </svg>
        </a>
        <a
          href="https://sriyansites.web.app"
          target="_blank"
          title="My Website"
        >
          <svg
            class="icon"
            width="35px"
            height="35px"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            fill="gray"
          >
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g
              id="SVGRepo_tracerCarrier"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></g>
            <g id="SVGRepo_iconCarrier">
              <defs>
                <style>
                  .cls-1 {
                    fill: none;
                    stroke: gray;
                    stroke-miterlimit: 10;
                    stroke-width: 1.92px;
                  }
                </style>
              </defs>
              <g id="roll_brush" data-name="roll brush">
                <rect
                  class="cls-1"
                  x="1.46"
                  y="1.5"
                  width="21.1"
                  height="21.1"
                ></rect>
                <polygon
                  class="cls-1"
                  points="22.56 7.25 16.28 7.25 14.37 7.25 1.46 7.25 1.46 1.5 22.56 1.5 22.56 7.25"
                ></polygon>
                <line
                  class="cls-1"
                  x1="4.34"
                  y1="4.38"
                  x2="6.25"
                  y2="4.38"
                ></line>
                <line
                  class="cls-1"
                  x1="8.17"
                  y1="4.38"
                  x2="10.09"
                  y2="4.38"
                ></line>
                <line
                  class="cls-1"
                  x1="12.01"
                  y1="4.38"
                  x2="13.93"
                  y2="4.38"
                ></line>
              </g>
            </g>
          </svg>
        </a>
      </span>
      <br />
      &copy; Copyright, Sai Sriyan Nakka 2026, All Rights Reserved.
      <br />Version 1.0.0 <br />
    </footer>

    <script type="module">
      import { getCookie } from "../assets/cookieFunctions.js";
      console.log("SCRIPT LOADED");

      const overlay = document.getElementById("loadingOverlay");

      const dashboardUsername = getCookie("dashboardUsername");

      try {
        if (!dashboardUsername) {
          window.location.href = "/login";
        }

        const res = await fetch("/api/user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: dashboardUsername }),
        });

        const data = await res.json();

        if (data.success) {
          document.querySelector("#accountName").textContent = data.accountName;
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("Something went wrong.");
      } finally {
        overlay.style.display = "none";
      }

      const userIcon = document.querySelector("#userIcon");
      const accountInfo = document.querySelector("#accountInfo");

      accountInfo.addEventListener("beforetoggle", (e) => {
        const rect = userIcon.getBoundingClientRect();

        if (e.newState === "open") {
          // Start 125px below the normal position
          accountInfo.style.top = `${rect.bottom + 20}px`;

          // Let the browser paint the starting position first
          requestAnimationFrame(() => {
            accountInfo.style.top = `${rect.bottom + 8}px`;
          });
        } else {
          // Animate downward when closing
          accountInfo.style.top = `${rect.bottom + 20}px`;
        }

        accountInfo.style.left = `${rect.left}px`;
      });
    </script>
  </body>
</html>
