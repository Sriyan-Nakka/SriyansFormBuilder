<style>
  #card {
    --hue: 300;
    --chroma: 0.16;

    --surface: oklch(17% calc(var(--chroma) * 0.75) var(--hue));
    --surface-container: oklch(24% calc(var(--chroma) * 0.75) var(--hue));
    --on-surface: oklch(91% calc(var(--chroma) * 0.55) var(--hue));

    position: relative;
    display: inline-block;

    padding: 5px;

    border-radius: 6px;
    overflow: hidden;

    background: white;

    filter: drop-shadow(0 5px 10px oklch(60% 0.16 var(--hue) / 0.5));
  }

  #cardBg {
    position: relative;
    z-index: 1;

    display: block;
    line-height: 0;
  }

  #cardBg svg {
    display: block;
  }

  #card::after {
    content: "";

    position: absolute;
    inset: 0;

    background: var(--surface-container);
    opacity: 0.45;

    z-index: 2;

    pointer-events: none;
  }

  #cardText {
    position: absolute;
    z-index: 3;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 68%;
    height: 58%;
    max-width: 800px;

    font-size: 10px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    text-align: center;

    color: var(--on-surface);
  }

  #cardText p {
    margin: 2px 0;
    color: var(--on-surface);
  }

  #username {
    font-size: 16px;
    font-weight: bold;
  }

  #handle,
  #id {
    display: block;
    color: var(--on-surface);
    font-size: 10px;
  }

  #emoji {
    font-size: 24px;
  }

  #cardText > * {
    max-width: 100%;

    overflow-wrap: anywhere;
    word-break: break-word;

    flex-shrink: 0;
  }
</style>

<div id="card">
